name: publish

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - subdir: server
            image: minimal-mean-server
            node: '12'
          - subdir: web-app
            image: minimal-mean-web-app
            node: '12'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: npm install
        working-directory: ${{ matrix.subdir }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: npm run build
        working-directory: ${{ matrix.subdir }}
        run: npm run build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        working-directory: ${{ matrix.subdir }}
        run: |
          docker build \
            -t expertlysimple/${{ matrix.image }}:latest \
            -t expertlysimple/${{ matrix.image }}:${{ github.sha }} \
            .
          docker push expertlysimple/${{ matrix.image }}:latest
          docker push expertlysimple/${{ matrix.image }}:${{ github.sha }}

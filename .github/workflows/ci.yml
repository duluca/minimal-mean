name: ci

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'duluca'
    strategy:
      fail-fast: false
      matrix:
        include:
          - subdir: server
            image: minimal-mean-server
            node: '12'
            container_port: 3000
            expected: "Server is up and running"
          - subdir: web-app
            image: minimal-mean-web-app
            node: '12'
            container_port: 80
            expected: "Minimal MEAN Web App"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: npm install
        working-directory: ${{ matrix.subdir }}
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: npm run build
        working-directory: ${{ matrix.subdir }}
        run: npm run build

      - name: Build image
        working-directory: ${{ matrix.subdir }}
        run: docker build -t local-test:${{ github.sha }} .

      - name: Smoke test - container starts and stays up
        run: |
          docker run -d --name testc -p 8080:${{ matrix.container_port }} local-test:${{ github.sha }}
          sleep 5
          docker ps --filter "name=testc" --filter "status=running" --format '{{.Names}}' | grep -q testc \
            || (echo "container exited"; docker logs testc; exit 1)

      - name: Endpoint check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS http://localhost:8080/ -o /tmp/body; then break; fi
            sleep 2
          done
          grep -qi "${{ matrix.expected }}" /tmp/body || (echo "expected content missing:"; cat /tmp/body; exit 1)

      - name: Cleanup
        if: always()
        run: docker rm -f testc 2>/dev/null || true

  auto-merge:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'duluca'
    steps:
      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch -R ${{ github.repository }}
